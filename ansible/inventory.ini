[local]
localhost ansible_connection=local

[kubernetes_cluster]
k8s-master ansible_host=YOUR_K8S_MASTER_IP ansible_user=YOUR_SSH_USER ansible_ssh_private_key_file=~/.ssh/id_rsa

[kubernetes_workers]
k8s-worker-1 ansible_host=YOUR_WORKER1_IP ansible_user=YOUR_SSH_USER ansible_ssh_private_key_file=~/.ssh/id_rsa
k8s-worker-2 ansible_host=YOUR_WORKER2_IP ansible_user=YOUR_SSH_USER ansible_ssh_private_key_file=~/.ssh/id_rsa

[docker_hosts]
docker-host ansible_host=YOUR_DOCKER_HOST_IP ansible_user=YOUR_SSH_USER ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
