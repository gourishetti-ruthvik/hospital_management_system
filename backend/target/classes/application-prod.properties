# Production Configuration
spring.config.activate.on-profile=prod

# Database Configuration (Update with production values)
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_management?useSSL=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=003318*s
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration (Use environment variables in production)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging
logging.level.com.hospital.management=INFO
logging.level.org.springframework.security=WARN
